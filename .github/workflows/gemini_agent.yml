name: Gemini Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
      GEMINI_API_KEY_2:
        required: false
      GEMINI_API_KEY_3:
        required: false
      GEMINI_API_KEY_4:
        required: false
      GEMINI_API_KEY_5:
        required: false
      GROQ_API_KEY:
        required: false

jobs:
  run_gemini_agent:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Central Agent Brain
        uses: actions/checkout@v4
        with:
          repository: chanuta159-design/AI-agent
          path: .agent_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Gemini Agent Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .agent_core/.github/scripts/agent.py
